name: OpenPak release

# Tag openpak-v1.2.3: builds Cemu for Linux, Windows and macOS with upstream's own build
# workflow and attaches the artifacts to a GitHub Release.
on:
  push:
    tags: ['openpak-v*']
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          mkdir -p upload
          for d in artifacts/*/; do n=$(basename "$d"); (cd "$d" && zip -qr "../../upload/${n}-${GITHUB_REF_NAME}.zip" .); done
          ls -la upload
      - if: startsWith(github.ref, 'refs/tags/openpak-v')
        run: gh release create "${GITHUB_REF_NAME}" upload/* --repo "${GITHUB_REPOSITORY}" --title "Cemu ${GITHUB_REF_NAME} (OpenPak)" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
