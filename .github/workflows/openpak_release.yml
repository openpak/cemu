name: OpenPak release

# Tag v1.2.3: builds Cemu for Linux, Windows and macOS with upstream's own build workflow
# (GitHub-hosted runners; this repository is public). The release is created first and each
# build job attaches its own zip to it, so nothing passes through workflow artifacts: the
# organisation's artifact quota can be full and stop a release (2026-09-23).
# workflow_dispatch builds without publishing.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - run: >
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "Cemu ${GITHUB_REF_NAME} (OpenPak)" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: [release]
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      release_tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
